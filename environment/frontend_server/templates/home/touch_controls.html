<!-- ==========================================================================
     TOUCH CONTROLS (mobile)
     An on-screen D-pad and zoom buttons for touch devices. They drive the same
     player/camera sprite the arrow keys do, via a shared window.touch_state
     object read by the Phaser update() loop, and window.game_camera for zoom.
     Hidden automatically on devices with a precise pointer (desktops).
=========================================================================== -->

<style>
  /* Make the game canvas responsive: full width, capped, aspect kept by FIT. */
  #game-container { width: 100%; height: 75vh; max-width: 1500px; margin: 0 auto; }
  #game-container canvas { display: block; margin: 0 auto; }

  #touch-controls, #touch-zoom {
    position: fixed; z-index: 1100; user-select: none;
    -webkit-user-select: none; touch-action: none; }
  #touch-controls { left: 0.8em; bottom: 0.8em; }
  #touch-controls .dpad { position: relative; width: 9.6em; height: 9.6em; }
  #touch-controls .tc-btn {
    position: absolute; width: 3.2em; height: 3.2em; padding: 0;
    background: rgba(40,40,40,0.55); color: #fff; border: none;
    border-radius: 10px; font-size: 1em; line-height: 1;
    display: flex; align-items: center; justify-content: center; }
  #touch-controls .tc-btn:active { background: rgba(40,40,40,0.85); }
  #tc-up    { left: 3.2em; top: 0; }
  #tc-down  { left: 3.2em; top: 6.4em; }
  #tc-left  { left: 0;     top: 3.2em; }
  #tc-right { left: 6.4em; top: 3.2em; }

  #touch-zoom { left: 0.8em; bottom: 11.2em; }
  #touch-zoom button {
    width: 3.2em; height: 3.2em; font-size: 1.2em; margin-right: 0.3em;
    background: rgba(40,40,40,0.55); color: #fff; border: none;
    border-radius: 10px; }
  #touch-zoom button:active { background: rgba(40,40,40,0.85); }

  /* Hide the touch overlay on devices with a precise pointer (desktops). */
  @media (hover: hover) and (pointer: fine) {
    #touch-controls, #touch-zoom { display: none; }
  }
</style>

<div id="touch-zoom">
  <button id="tc-zoom-in" aria-label="Zoom in">＋</button>
  <button id="tc-zoom-out" aria-label="Zoom out">－</button>
</div>
<div id="touch-controls">
  <div class="dpad">
    <button class="tc-btn" id="tc-up" aria-label="Up">▲</button>
    <button class="tc-btn" id="tc-left" aria-label="Left">◀</button>
    <button class="tc-btn" id="tc-right" aria-label="Right">▶</button>
    <button class="tc-btn" id="tc-down" aria-label="Down">▼</button>
  </div>
</div>

<script>
(function () {
  window.touch_state = { left: false, right: false, up: false, down: false };

  function bind(id, dir) {
    var el = document.getElementById(id);
    if (!el) return;
    var set = function (v) {
      return function (e) { e.preventDefault(); window.touch_state[dir] = v; };
    };
    el.addEventListener('pointerdown', set(true));
    el.addEventListener('pointerup', set(false));
    el.addEventListener('pointerleave', set(false));
    el.addEventListener('pointercancel', set(false));
    // Fallbacks for older touch browsers without Pointer Events.
    el.addEventListener('touchstart', set(true), { passive: false });
    el.addEventListener('touchend', set(false));
  }
  bind('tc-up', 'up'); bind('tc-down', 'down');
  bind('tc-left', 'left'); bind('tc-right', 'right');

  function zoom(factor) {
    var cam = window.game_camera;
    if (!cam) return;
    cam.setZoom(Math.max(0.2, Math.min(3, cam.zoom * factor)));
  }
  var zin = document.getElementById('tc-zoom-in');
  var zout = document.getElementById('tc-zoom-out');
  if (zin) zin.addEventListener('click', function () { zoom(1.2); });
  if (zout) zout.addEventListener('click', function () { zoom(1 / 1.2); });
})();
</script>
