{% load staticfiles %}

<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	let step = parseInt(document.getElementById('step').innerHTML);
	let sim_code = document.getElementById('sim_code').innerHTML;
	// let persona_names = document.getElementById('persona_name_list').innerHTML.split(",");

	let spans = document.getElementById('persona_init_pos').getElementsByTagName('span');
	let persona_names = {};
	for(var i = 0, l = spans.length; i < l; i++){
		let x = spans[i].innerText.split(",");
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])]
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  // Use CANVAS, not Phaser.AUTO (which prefers WebGL). The interior tilesets
	  // are ~10,000px tall, which exceeds the 8192px max texture size on many
	  // GPUs; under WebGL those oversized textures fail to upload and the
	  // building interiors render as black blocks (outdoor 512x512 tilesets are
	  // unaffected). The Canvas renderer has no max-texture-size limit, so the
	  // interiors paint correctly on any GPU. (Maps are static here, so the
	  // small perf cost of Canvas vs WebGL is irrelevant.)
	  type: Phaser.CANVAS,
	  // Responsive scaling: the game renders at a fixed 1500x800 design
	  // resolution and is scaled to FIT the parent container (preserving aspect
	  // ratio and centering), so it adapts to phones, tablets and desktops.
	  scale: {
	    mode: Phaser.Scale.FIT,
	    autoCenter: Phaser.Scale.CENTER_BOTH,
	    parent: "game-container",
	    width: 1500,
	    height: 800 },
	  pixelArt: true,
	  physics: {
	    default: "arcade",
	    arcade: {
	      gravity: { y: 0 } } },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };

	// const config = {
	//   type: Phaser.AUTO,
	//   width: 4480,
	//   height: 3200,
	//   parent: "game-container",
	//   pixelArt: true,
	//   physics: {
	//     default: "arcade",
	//     arcade: {
	//       gravity: { y: 0 } } },
	//   scene: {
	//     preload: preload,
	//     create: create,
	//     update: update },
	//   scale: {zoom: 0.5} };

	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);
	let cursors;
	let player;
	let showDebug = false;

	// Persona related variables. This should have the name of the persona as its 
	// keys, and the instances of the Persona class as the values.
	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
	}
	console.log(spawn_tile_loc);

	var personas = {};
	var pronunciatios = {};
	var speech_bubbles = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};

	let curr_maze = "the_ville";

	// *** PLAY MODE ***
	// In "play" mode the <player> sprite becomes a visible, collidable, human-
	// controlled resident whose tile position is reported to the backend so the
	// agents perceive (and can converse with) them. In every other mode the
	// <player> sprite is just the invisible camera anchor it has always been.
	let PLAY_MODE = {% if mode == "play" %}true{% else %}false{% endif %};
	let player_name = "{{ player_name|default:'You'|escapejs }}";
	let player_spawn_tile = [{{ player_init_x|default:72 }}, {{ player_init_y|default:14 }}];

	// *** REAL-TIME TRANSPORT ***
	// Try a WebSocket to the backend bridge; if it is unavailable (Channels not
	// installed/misconfigured) we transparently fall back to the original XHR
	// polling. The WebSocket lets the server *push* movement and chat replies
	// the instant they are ready, instead of the browser polling every frame.
	let sim_ws = null;
	let USE_WS = false;
	let ws_awaiting_movement = false;
	function wsReady() { return USE_WS && sim_ws && sim_ws.readyState === 1; }
	(function initSimWS() {
	  try {
	    let proto = (location.protocol === "https:") ? "wss:" : "ws:";
	    sim_ws = new WebSocket(proto + "//" + location.host + "/ws/sim/");
	    sim_ws.onopen = function () { USE_WS = true; console.log("[sim] WebSocket connected"); };
	    sim_ws.onclose = function () { USE_WS = false; };
	    sim_ws.onerror = function () { USE_WS = false; };
	    sim_ws.onmessage = function (e) {
	      let msg = JSON.parse(e.data);
	      if (msg.action === "movement") {
	        if (msg["<step>"] == step) {
	          execute_movement = msg;
	          ws_awaiting_movement = false;
	          phase = "execute";
	        }
	      } else if (msg.action === "player_chat_response") {
	        if (typeof window.onPlayerChatResponse === "function") {
	          window.onPlayerChatResponse(msg);
	        }
	      }
	    };
	  } catch (err) { USE_WS = false; }
	})();
	// Lets play_controls.html send chat over the WebSocket when one is open.
	window.simSendChat = function (payload) {
	  if (wsReady()) {
	    payload.action = "player_chat";
	    sim_ws.send(JSON.stringify(payload));
	    return true;
	  }
	  return false;
	};

	// Transport indicator: green = live WebSocket, grey = polling. Prefer the
	// status dot/label baked into the nav bar (home.html); only fall back to a
	// floating corner dot when the page has no nav indicator.
	(function () {
	  let dot = document.getElementById("ws-status-dot");
	  let label = document.getElementById("ws-status-label");
	  if (!dot) {
	    dot = document.createElement("div");
	    dot.id = "ws-status-dot";
	    dot.style.cssText = "position:fixed; top:8px; right:8px; width:12px;" +
	      " height:12px; border-radius:50%; background:#bbb; z-index:2000;" +
	      " box-shadow:0 0 4px rgba(0,0,0,0.4);";
	    document.body.appendChild(dot);
	  }
	  setInterval(function () {
	    if (wsReady()) {
	      dot.style.background = "#2ecc40"; dot.title = "Live (WebSocket)";
	      if (label) { label.textContent = "Live"; label.style.color = "#5ba85a"; }
	    } else {
	      dot.style.background = "#bbb"; dot.title = "Polling (no WebSocket)";
	      if (label) { label.textContent = "Polling"; label.style.color = "var(--muted)"; }
	    }
	  }, 500);
	})();

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;
	// While sleeping on a bed, show the tucked-in pose (face-the-camera frame
	// on the bed's pillow row, or a real "lie" frame if the character's sheet
	// has one). Set to false to disable any special sleep pose.
	let GROUND_SLEEP = true;
	// Conversation bubbles: how long (ms) each line of dialogue stays up before
	// the next line is revealed, plus a per-conversation progress tracker so the
	// reveal is paced across the conversation instead of dumping all lines at once.
	let CHAT_LINE_MS = 2800;
	let convoProgress = {};
	// Tracks how many lines of each conversation have already been written to
	// the on-page conversation feed (home.html), so each line is logged once
	// even though both participants carry the same chat array.
	let feedPushed = {};
	// Important: tile_width % movement_speed has to be 0.
	// <movement_speed> determines how fast we move at each upate cylce.
	// 4px/frame = 8 frames per tile, so agents glide between tiles instead of
	// teleporting a whole tile per frame (which is what 32 did).
	let movement_speed = 4;

	// Personas render 25% larger than their 32px frames for readability.
	let SPRITE_SCALE = 1.25;
	let sprite_disp_size = tile_width * SPRITE_SCALE;
	// Physics-body offset that keeps the scaled sprite centered ON its logical
	// tile (both axes). The historic "+32" y-offset hack drew every agent one
	// full tile above its tile -- uniform for walkers, but it left sleepers
	// floating just off their beds. The demo template's on-tile alignment is
	// restored here, generalized for any scale.
	let sprite_center_off = tile_width / 2 * (1 - 1 / SPRITE_SCALE);
	// Walk-cycle speed; slightly faster than the original 4 so the leg cadence
	// matches the new glide speed.
	let WALK_FRAME_RATE = 6;

	// *** RENDER DEPTHS ***
	// Personas are Y-sorted every frame (depth = body.y, the painter's
	// algorithm) so agents lower on the screen draw in front of agents above
	// them. Foreground tile layers (roofs, wall tops) sit above every persona,
	// and speech bubbles/pronunciatios sit above everything so dialogue is
	// never hidden -- while staying Y-sorted among themselves.
	let FOREGROUND_DEPTH = 100000;
	let BUBBLE_DEPTH = 1000000;

	// Speech-bubble fit around the dialogue text: horizontal padding, headroom
	// above the text, and how far the bubble's tail extends below the text.
	let BUBBLE_PAD_X = 14;
	let BUBBLE_PAD_TOP = 8;
	let BUBBLE_TAIL = 14;

	// *** OBJECT-INTERACTION GROUNDING ***
	// When an idle agent is standing on one of these game objects, we pose them
	// so they read as *using* it rather than standing on it. Seat-like objects
	// face the camera ("sitting"); appliance-like objects face away ("using").
	// If a character's sprite sheet ships dedicated "sit"/"lie" frames (added
	// to assets/characters/<Name>.png + atlas.json), those are used instead --
	// the approximation is only the fallback.
	let SEAT_OBJECTS = ["chair", "sofa", "couch", "bench", "stool", "seating"];
	let APPLIANCE_OBJECTS = ["sink", "desk", "stove", "counter", "cooking area",
	                         "kitchen", "refrigerator", "toilet", "shower",
	                         "bathtub", "piano", "easel", "computer", "shelf",
	                         "bookshelf", "cabinet", "dresser", "blackboard"];

	// *** BED HEADBOARD DIRECTIONS ***
	// The Ville's beds are NOT all headboard-up: most are vertical (head up) but
	// a handful are drawn horizontally (head to the left). The in-bed sleep
	// sprite is drawn head-up, so it must be rotated to match each bed. This map
	// (bed tile "x,y" -> head direction) is derived from the static map's bed
	// sprites + walls; the map never changes, so it is baked in here. Tiles not
	// listed default to "up".  (Latoya Williams's 16,18 corner bed is ambiguous
	// and left as "up".)
	let BED_HEAD = {"53,14":"up","54,14":"up","72,14":"up","73,14":"up","16,18":"up","25,18":"up","26,18":"up","36,18":"left","86,18":"up","87,18":"up","93,18":"up","94,18":"up","65,19":"up","66,19":"up","16,32":"left","26,32":"left","126,46":"up","127,46":"up","123,57":"left","118,61":"up","119,61":"up","107,62":"left","20,65":"up","21,65":"up","28,65":"up","29,65":"up","36,65":"up","37,65":"up","54,74":"up","55,74":"up","57,74":"up","58,74":"up","72,74":"up","73,74":"up","75,74":"up","76,74":"up","90,74":"up","91,74":"up","93,74":"up","94,74":"up"};
	let BED_HEAD_ANGLE = {up: 0, right: 90, down: 180, left: 270};

	// <timer_max> determines how frequently our update function will query the 
	// frontend server. If it's higher, we wait longer cycles. 
	let timer_max = 0;
	let timer = timer_max;

	// <phase> -- there are three phases: "process," "update," and "execute."
	let phase = "update"; // or "update" or "execute"

	// Variables for storing movements that are sent from the backend server.
	let execute_movement;
	let execute_count_max = tile_width/movement_speed;
	let execute_count = execute_count_max;
	let movement_target = {};

	// *** WORLD-FX STATE ***
	// Per-persona particle emitters for the sleeping "Zzz" rise and the
	// footstep dust burst. Keyed by persona name; created lazily and torn
	// down when no longer needed. (See Phaser FX patches in update().)
	let zzz_emitters = {};
	let dust_emitters = {};
	

	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
	  this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
	  this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
	  this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
	  this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
	  this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
	  this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
	  this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
	  this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
	  this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
	  this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");

	  // Joon: This is the export json file you get from Tiled. 
	  this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  this.load.atlas("atlas",
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.png",
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.json");

	  // Per-character sprite sheets: each agent gets their own look. Every sheet
	  // (Isabella_Rodriguez.png, etc.) shares the same frame layout defined in
	  // assets/characters/atlas.json. We key each atlas by the persona's name.
	  // ASSET_VER busts the browser cache when the sheets/atlas change (Phaser
	  // fetches these itself, so a plain page refresh can keep stale copies that
	  // lack newer frames like "lie"/"sit"/"lean"). Bump it when the character
	  // art or atlas.json changes.
	  var ASSET_VER = "20260625b";
	  var char_json = "{% static 'assets/characters/atlas.json' %}";
	  var char_base = char_json.replace("atlas.json", "");
	  for (var pkey in persona_names) {
	    this.load.atlas(pkey,
	                    char_base + pkey.replace(/ /g, "_") + ".png?v=" + ASSET_VER,
	                    char_json + "?v=" + ASSET_VER);
	  }

	  // Speech-bubble art shown behind the active speaker's dialogue line.
	  this.load.image('speech_bubble', "{% static 'assets/speech_bubble/v3.png' %}");
	}

	function create() {
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const collisions = map.addTilesetImage("blocks", "blocks_1");
	  const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
	  const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
	  const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
	  const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
	  const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
	  const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
	  const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
	  const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
	  const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B, 
	  											 CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
	  											 interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
	  const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
	  const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
	  const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
	  const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
	  const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
	  const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
	  const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
	  const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
	  const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);
	  // Roofs and wall tops must occlude every Y-sorted persona (whose depths
	  // top out around the map height in pixels), so they sit far above them.
	  foregroundL1Layer.setDepth(FOREGROUND_DEPTH);
	  foregroundL2Layer.setDepth(FOREGROUND_DEPTH);

	  const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);
	  // const groundLayer = map.createLayer("Ground", walls, 0, 0);
	  // const indoorGroundLayer = map.createLayer("Indoor Ground", walls, 0, 0);
	  // const wallsLayer = map.createLayer("Walls", walls, 0, 0);
	  // const interiorsLayer = map.createLayer("Furnitures", interiors, 0, 0);
	  // const builtInLayer = map.createLayer("Built-ins", interiors, 0, 0);
	  // const appliancesLayer = map.createLayer("Appliances", interiors, 0, 0);
	  // const foregroundLayer = map.createLayer("Foreground", interiors, 0, 0);

	  // Joon : This is where you want to create a custom field for the tileset
	  //        in Tiled. Take a look at this guy's tutorial: 
	  //        https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	  collisionsLayer.setCollisionByProperty({ collide: true });
	  // By default, everything gets depth sorted on the screen in the order we 
	  // created things. Here, we want the "Above Player" layer to sit on top of 
	  // the player, so we explicitly give it a depth. Higher depths will sit on 
	  // top of lower depth objects.
	  // Collisions layer should get a negative depth since we do not want to see
	  // it. 
	  collisionsLayer.setDepth(-1);
	  // foregroundL1Layer.setDepth(2);
	  // foregroundL1Layer.setDepth(2);

	  // *** SET UP CAMERA *** 
	  // "player" is to be set as the center of mass for our "camera." We 
	  // basically create a game character sprite as we would for our personas 
	  // but we move it to depth -1 and let it pass through the collision map;  
	  // that is, do not have the following line: 
	  // this.physics.add.collider(player, collisionsLayer);
	  // OLD NOTE: Create a sprite with physics enabled via the physics system. 
	  // The image  used for the sprite has a bit of whitespace, so I'm using 
	  // setSize & setOffset to control the size of the player's body.
	  // In play mode spawn the player on a known-walkable tile and make them a
	  // visible, collidable character; otherwise keep the historic invisible
	  // camera-anchor behaviour (depth -1, passes through collisions).
	  let player_start_x = PLAY_MODE ? player_spawn_tile[0] * tile_width + tile_width / 2 : 800;
	  let player_start_y = PLAY_MODE ? player_spawn_tile[1] * tile_width + tile_width : 288;
	  player = this.physics.add.
	                sprite(player_start_x, player_start_y, "atlas", "misa-front").
	                setSize(30, 40).
	                setOffset(0, 0);
	  if (PLAY_MODE) {
	    player.setDepth(1);
	    this.physics.add.collider(player, collisionsLayer);
	  } else {
	    player.setDepth(-1);
	  }
	  // Setting up the camera.
	  const camera = this.cameras.main;
	  camera.startFollow(player);
	  camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
	  cursors = this.input.keyboard.createCursorKeys();
	  // Expose the camera so the on-screen touch zoom buttons can drive it.
	  window.game_camera = camera;

	  // Move the agent name tooltip with the cursor while it is visible.
	  this.input.on('pointermove', function (ptr) {
	    var tip = document.getElementById('sprite-tooltip');
	    if (tip && tip.style.display === 'block') {
	      tip.style.left = (ptr.x + 14) + 'px';
	      tip.style.top  = (ptr.y - 8)  + 'px';
	    }
	  });

	  // *** WORLD-FX TEXTURES ***
	  // Generate two tiny circle textures used by the particle emitters: a
	  // blue-grey "Zzz" mote for sleepers and a brown dust speck for footsteps.
	  try {
	    if (!this.textures.exists('zzz_particle')) {
	      var zzz_gfx = this.add.graphics();
	      zzz_gfx.fillStyle(0x8aaac8, 1);
	      zzz_gfx.fillCircle(4, 4, 4);
	      zzz_gfx.generateTexture('zzz_particle', 8, 8);
	      zzz_gfx.destroy();
	    }
	    if (!this.textures.exists('dust_particle')) {
	      var dust_gfx = this.add.graphics();
	      dust_gfx.fillStyle(0x8a7050, 1);
	      dust_gfx.fillCircle(3, 3, 3);
	      dust_gfx.generateTexture('dust_particle', 6, 6);
	      dust_gfx.destroy();
	    }
	  } catch (e) { console.warn('world-fx texture gen failed', e); }

	  // *** FOCUS MODE ***
	  // Follow a chosen agent ("through their eyes"), switchable live while you
	  // watch. unfocus() returns to the free-roam camera (the invisible player
	  // sprite that the arrow keys pan in view/replay mode).
	  window.focused_persona = null;
	  window.focusPersona = function (name) {
	    if (personas[name]) {
	      camera.startFollow(personas[name]);
	      camera.setZoom(Math.max(camera.zoom, 1.6));
	      window.focused_persona = name;
	      if (window.onFocusChange) window.onFocusChange(name);
	    }
	  };
	  window.unfocus = function () {
	    camera.startFollow(player);
	    window.focused_persona = null;
	    if (window.onFocusChange) window.onFocusChange(null);
	  };

	  // *** TOUCH GESTURES ***
	  // Pinch-to-zoom works in every mode. Drag-to-pan is enabled only outside
	  // play mode -- in play mode a drag must not drag your own avatar around.
	  this.input.addPointer(2);
	  let pinch_prev_dist = 0;
	  this.input.on('pointermove', function (pointer) {
	    let p1 = this.input.pointer1, p2 = this.input.pointer2;
	    if (p1.isDown && p2.isDown) {
	      let dist = Phaser.Math.Distance.Between(p1.x, p1.y, p2.x, p2.y);
	      if (pinch_prev_dist > 0) {
	        camera.setZoom(Math.max(0.2, Math.min(3,
	                        camera.zoom * (dist / pinch_prev_dist))));
	      }
	      pinch_prev_dist = dist;
	      return;
	    }
	    pinch_prev_dist = 0;
	    if (!PLAY_MODE && pointer.isDown) {
	      player.x -= (pointer.x - pointer.prevPosition.x) / camera.zoom;
	      player.y -= (pointer.y - pointer.prevPosition.y) / camera.zoom;
	    }
	  }, this);
	  this.input.on('pointerup', function () { pinch_prev_dist = 0; }, this);

	  // *** SET UP PERSONAS *** 
	  // We start by creating the game sprite objects. 
	  for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) { 
	    let persona_name = Object.keys(spawn_tile_loc)[i];
	    let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2, 
	                     spawn_tile_loc[persona_name][1] * tile_width + tile_width];
	    // Each persona renders from their own loaded atlas (keyed by name), so
	    // they look like themselves instead of all sharing the Misa sprite.
	    // The computed offset centers the scaled sprite on its logical tile.
	    let new_sprite = this.physics.add
	                         .sprite(start_pos[0], start_pos[1], persona_name, "down")
	                         .setSize(30, 40)
	                         .setOffset(sprite_center_off, sprite_center_off);
	    new_sprite.displayWidth = sprite_disp_size;
	    new_sprite.scaleY = new_sprite.scaleX;
	    new_sprite.setDepth(new_sprite.body.y);
	    // Here, we are creating the persona and its pronunciatio sprites.
	    personas[persona_name] = new_sprite;

	    // *** CLICKABLE SPRITES ***
	    // Click/tap any agent to focus the camera on them and surface their
	    // sidebar card (showAgentPanel is defined in home.html). Hover dims the
	    // sprite slightly and shows a name tooltip that tracks the cursor.
	    (function (pname, sprite) {
	      sprite.setInteractive({ useHandCursor: true });
	      sprite.on('pointerdown', function () {
	        if (typeof window.showAgentPanel === 'function') window.showAgentPanel(pname);
	        else if (typeof window.focusPersona === 'function') window.focusPersona(pname);
	      });
	      sprite.on('pointerover', function () {
	        this.setAlpha(0.82);
	        var tip = document.getElementById('sprite-tooltip');
	        if (tip) { tip.textContent = pname; tip.style.display = 'block'; }
	      });
	      sprite.on('pointerout', function () {
	        this.setAlpha(1.0);
	        var tip = document.getElementById('sprite-tooltip');
	        if (tip) tip.style.display = 'none';
	      });
	    })(persona_name, new_sprite);

	    // *** OBJECT-TILE GLOW ***
	    // One Graphics object per persona; in update() it draws a soft pulsing
	    // rectangle on the tile of whatever game object the agent is using.
	    var obj_glow_graphics = this.add.graphics();
	    obj_glow_graphics.setDepth(new_sprite.body.y - 1);
	    window['obj_glow_' + persona_name] = obj_glow_graphics;

	    // One hidden speech-bubble per persona, drawn as a Phaser Graphics object
	    // (a crisp rounded rectangle with a drop shadow and a pointed tail)
	    // instead of a stretched PNG. Shown and redrawn around the current line
	    // only while they are the active speaker. The same key is reused so the
	    // rest of the bubble logic (visibility, depth, layoutBubbles) is intact.
	    speech_bubbles[persona_name] = this.add.graphics()
	                                   .setVisible(false)
	                                   .setDepth(BUBBLE_DEPTH + new_sprite.body.y - 1);

	    // The pronunciatio is bottom-center anchored so both the emoji chip and
	    // multi-line dialogue stay centered above the agent's head.
	    pronunciatios[persona_name] = this.add.text(
	                                   new_sprite.body.x + tile_width / 2,
	                                   new_sprite.body.y + tile_width / 2 - sprite_disp_size / 2 - 8,
	                                   "🦁", {
	                                   font: "28px monospace",
	                                   fill: "#000000",
	                                   padding: { x: 8, y: 8},
	                                   backgroundColor: "#ffffff",
	                                   border:"solid",
	                                   borderRadius:"10px"})
	                                  .setOrigin(0.5, 1)
	                                  .setDepth(BUBBLE_DEPTH + new_sprite.body.y);
	  }

	  // Create the player's walking animations from the texture atlas. These are
	  // stored in the global animation manager so any sprite can access them.
	  const anims = this.anims;
	  anims.create({
	    key: "misa-left-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-left-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-right-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-right-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-front-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-front-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  anims.create({
	    key: "misa-back-walk",
	    frames: anims.generateFrameNames("atlas", { prefix: "misa-back-walk.", start: 0, end: 3, zeroPad: 3 }),
	    frameRate: 4,
	    repeat: -1 });

	  // Per-character walking animations (down/left/right/up) built from each
	  // agent's own atlas, keyed "<Persona Name>-<dir>-walk".
	  for (var pkey in persona_names) {
	    ["down", "left", "right", "up"].forEach(function (dir) {
	      anims.create({
	        key: pkey + "-" + dir + "-walk",
	        frames: anims.generateFrameNames(pkey,
	                  { prefix: dir + "-walk.", start: 0, end: 3, zeroPad: 3 }),
	        frameRate: WALK_FRAME_RATE,
	        repeat: -1 });
	    });
	  }
	}


	// *** BUBBLE DE-OVERLAP ***
	// Dialogue bubbles and pronunciatio chips must never cover each other --
	// overlapping bubbles made conversations unreadable. Each frame, right
	// after the natural above-the-head positions are set, this pass stacks any
	// colliding elements upward: speakers' dialogue bubbles claim their spot
	// first (so their tails stay on their own heads), then everything else
	// shifts up out of the way. Shifts are recomputed from the natural
	// positions every frame, so nothing drifts over time.
	let BUBBLE_GAP = 4;

	function bubbleRect(txt, bub) {
	  let t = txt.getBounds();
	  if (!bub || !bub.visible) {
	    return {x: t.x, y: t.y, w: t.width, h: t.height};
	  }
	  // The bubble art extends past the text; use the union of both boxes.
	  let b = bub.getBounds();
	  let x = Math.min(b.x, t.x);
	  let y = Math.min(b.y, t.y);
	  return {x: x, y: y,
	          w: Math.max(b.right, t.right) - x,
	          h: Math.max(b.bottom, t.bottom) - y};
	}

	function layoutBubbles() {
	  let entries = [];
	  for (let name in personas) {
	    if (!pronunciatios[name]) continue;
	    entries.push({txt: pronunciatios[name],
	                  bub: speech_bubbles[name],
	                  speaking: speech_bubbles[name] && speech_bubbles[name].visible,
	                  base_y: personas[name].body.y});
	  }
	  // Speakers place first; within each group, elements lower on the screen
	  // keep their natural spot and higher ones stack above them.
	  entries.sort(function (a, b) {
	    if (a.speaking != b.speaking) return a.speaking ? -1 : 1;
	    return b.base_y - a.base_y;
	  });
	  let placed = [];
	  entries.forEach(function (e) {
	    let r = bubbleRect(e.txt, e.bub);
	    for (let guard = 0; guard < 40; guard++) {
	      let hit = null;
	      for (let i = 0; i < placed.length; i++) {
	        let p = placed[i];
	        if (r.x < p.x + p.w + BUBBLE_GAP && p.x < r.x + r.w + BUBBLE_GAP &&
	            r.y < p.y + p.h + BUBBLE_GAP && p.y < r.y + r.h + BUBBLE_GAP) {
	          hit = p;
	          break;
	        }
	      }
	      if (!hit) break;
	      // Lift this element straight up until it clears the one it hit,
	      // then re-check against everything already placed.
	      let dy = (hit.y - r.h - BUBBLE_GAP) - r.y;
	      e.txt.y += dy;
	      if (e.bub && e.bub.visible) e.bub.y += dy;
	      r.y += dy;
	    }
	    placed.push(r);
	  });
	}


	function update(time, delta) {
		// Scene handle for the world-FX particle emitters created below.
		var curr_scene = this;

		// *** THINKING STATE OVERLAY ***
		// While the backend computes the next step (phase === "update"), pulse an
		// amber inner border around the canvas and show a small status chip. The
		// overlay element lives in home.html inside #sim-canvas-wrap.
		(function () {
		  var overlay = document.getElementById('thinking-overlay');
		  if (!overlay) return;
		  var label = document.getElementById('thinking-label');
		  if (phase === 'update') {
		    overlay.style.display = 'block';
		    if (label) label.textContent = 'Step ' + step + ' · Agents reflecting…';
		  } else {
		    overlay.style.display = 'none';
		  }
		})();

		// *** SETUP PLAY AND PAUSE BUTTON ***
		let play_context = this;
		function game_resume() {  
			play_context.scene.resume();
		}  
		play_button.onclick = function(){
			game_resume();
		};
		function game_pause() {  
			play_context.scene.pause();
		}  
		pause_button.onclick = function(){
			game_pause();
		};

	  // *** MOVE CAMERA *** 
	  // This is where we finish up the camera setting we started in the create() 
	  // function. We set the movement speed of the camera and wire up the keys to
	  // map to the actual movement.
	  // Walking pace in play mode, faster free-fly pan otherwise.
	  const camera_speed = PLAY_MODE ? 160 : 400;
	  // Stop any previous movement from the last frame
	  player.body.setVelocity(0);
	  // Combine keyboard arrows with the on-screen touch D-pad (mobile).
	  let ts = window.touch_state || {};
	  let player_move_dir = "";
	  if (cursors.left.isDown || ts.left) {
	    player.body.setVelocityX(-camera_speed);
	    player_move_dir = "l";
	  }
	  if (cursors.right.isDown || ts.right) {
	    player.body.setVelocityX(camera_speed);
	    player_move_dir = "r";
	  }
	  if (cursors.up.isDown || ts.up) {
	    player.body.setVelocityY(-camera_speed);
	    player_move_dir = "u";
	  }
	  if (cursors.down.isDown || ts.down) {
	    player.body.setVelocityY(camera_speed);
	    player_move_dir = "d";
	  }
	  // Animate the player's avatar in play mode, and keep them in the same
	  // Y-sorted depth scheme as the agents.
	  if (PLAY_MODE) {
	    if (player_move_dir == "l") player.anims.play("misa-left-walk", true);
	    else if (player_move_dir == "r") player.anims.play("misa-right-walk", true);
	    else if (player_move_dir == "u") player.anims.play("misa-back-walk", true);
	    else if (player_move_dir == "d") player.anims.play("misa-front-walk", true);
	    else player.anims.stop();
	    player.setDepth(player.body.y);
	  }

	  // console.log("phase: " + phase + ", step: " + step);
	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process") {
	    // "process" takes all current locations of the personas and send them to
	    // the frontend server in a json form. Here, we first create the json 
	    // file that records all persona locations: 
	    let data = {"step": step, 
	    						"sim_code": sim_code,
	                "environment": {}}
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let persona_name = Object.keys(personas)[i];
	      data["environment"][persona_name] = {"maze": curr_maze,
	                                           "x": Math.ceil((personas[persona_name].body.position.x) / tile_width),
	                                           "y": Math.ceil((personas[persona_name].body.position.y) / tile_width)}
	    }
	    // In play mode, report the human player so the backend projects them
	    // into the world for the agents to perceive.
	    if (PLAY_MODE) {
	      data["environment"]["Player"] = {
	        "maze": curr_maze,
	        "x": Math.ceil((player.body.position.x) / tile_width),
	        "y": Math.ceil((player.body.position.y) / tile_width),
	        "name": player_name,
	        "description": "walking around the town"};
	    }
	    var json = JSON.stringify(data);
	    // Send the world state to the backend -- over the WebSocket if one is
	    // open, otherwise via the original HTTP endpoint.
	    if (wsReady()) {
	      sim_ws.send(JSON.stringify({"action": "process", "step": step,
	                                  "sim_code": sim_code,
	                                  "environment": data["environment"]}));
	    } else {
	      var retrieve_xobj = new XMLHttpRequest();
	      retrieve_xobj.overrideMimeType("application/json");
	      retrieve_xobj.open('POST', "{% url 'process_environment' %}", true);
	      retrieve_xobj.send(json);
	    }
	    // Now wait for the backend to determine what the personas do next.
	    ws_awaiting_movement = false;
	    phase = "update";
	  }

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    // Note that we do not want to overburden the backend too much by 
	    // over-querying; so, we have a timer set so we only query it once every
	    // timer_max cycles. 
	    if (wsReady()) {
	      // WebSocket path: ask once, then wait for the server to push the
	      // movement (handled in sim_ws.onmessage, which advances the phase).
	      if (!ws_awaiting_movement) {
	        ws_awaiting_movement = true;
	        sim_ws.send(JSON.stringify({"action": "await_movement",
	                                    "step": step, "sim_code": sim_code}));
	      }
	    } else if (timer <= 0) {
	      // Legacy HTTP polling fallback.
	      var update_xobj = new XMLHttpRequest();
	      update_xobj.overrideMimeType("application/json");
	      update_xobj.open('POST', "{% url 'update_environment' %}", true);
	      update_xobj.addEventListener("load", function() {
	        if (this.readyState === 4) {
	          if (update_xobj.status === 200) {
	            if (JSON.parse(update_xobj.responseText)["<step>"] == step) {
	              execute_movement = JSON.parse(update_xobj.responseText)
	              phase = "execute";
	            }
	            timer = timer_max;
	          }
	        }
	      });
	      update_xobj.send(JSON.stringify({"step": step, "sim_code": sim_code }));
	    }
	    timer = timer - 1;
	  }

	  else { 
	    // This is where we actually move the personas in the visual world. Each
	    // backend computation in execute_movement moves each persona by one tile
	    // (or some personas might not move if they choose not to). 
	    // The execute_count_max is computed by tile_width/movement_speed, which
	    // defines a one step sequence in this world. 
	    document.getElementById("game-time-content").innerHTML = execute_movement["meta"]["curr_time"];
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let curr_persona_name = Object.keys(personas)[i];
	      let curr_persona = personas[curr_persona_name];
	      let curr_pronunciatio = pronunciatios[Object.keys(personas)[i]];

	      if (execute_count == execute_count_max) {
	        // The backend's tile is authoritative: never retarget an agent
	        // elsewhere (e.g. to a bed's center) -- the backend re-paths them
	        // straight back to its own chosen tile, and the two ends fight,
	        // leaving sleepers endlessly shuffling around their beds.
	        let curr_x = execute_movement["persona"][curr_persona_name]["movement"][0];
	        let curr_y = execute_movement["persona"][curr_persona_name]["movement"][1];
	        movement_target[curr_persona_name] = [curr_x * tile_width,
	                                              curr_y * tile_width];
	        let pronunciatio_content = execute_movement["persona"][curr_persona_name]["pronunciatio"];
	        // This is what gives the pronunciatio balloon the name initials. We 
	        // use regex to extract the initials of the personas. 
	        // E.g., "Dolores Murphy" -> "DM"
	        let rgx = new RegExp(/(\p{L}{1})\p{L}+/, 'gu');
	        let initials = [...curr_persona_name.matchAll(rgx)] || [];
	        initials = (
	          (initials.shift()?.[1] || '') + (initials.pop()?.[1] || '')
	        ).toUpperCase();
	        pronunciatios[curr_persona_name].setText(initials + ": " + pronunciatio_content);
	      }

	      // --- Level B: paced on-map conversation bubbles ---
      // The backend delivers the whole conversation in "chat" for its duration;
      // we reveal it one line at a time (paced by wall-clock time), showing the
      // current line inside the speech-bubble graphic above whoever is
      // speaking. Listeners show a plain balloon. Each newly revealed line is
      // also appended (once) to the conversation feed panel in home.html.
      let chat_lines = execute_movement["persona"][curr_persona_name]["chat"];
      let curr_bubble = speech_bubbles[curr_persona_name];
      if (chat_lines && chat_lines.length > 0) {
        let sig = curr_persona_name + "|" + JSON.stringify(chat_lines);
        if (!convoProgress[sig]) convoProgress[sig] = {idx: 0, tNext: time + CHAT_LINE_MS};
        let st = convoProgress[sig];
        if (time > st.tNext && st.idx < chat_lines.length - 1) {
          st.idx += 1; st.tNext = time + CHAT_LINE_MS;
        }
        // Log revealed lines to the feed exactly once per conversation, keyed
        // on the conversation content (both participants share it).
        let feed_key = JSON.stringify(chat_lines);
        let pushed = feedPushed[feed_key] || 0;
        for (let k = pushed; k <= st.idx; k++) {
          if (window.convoFeedAppend) {
            window.convoFeedAppend(chat_lines[k][0], chat_lines[k][1],
                                   execute_movement["meta"]["curr_time"]);
          }
        }
        if (st.idx + 1 > pushed) feedPushed[feed_key] = st.idx + 1;

        let line = chat_lines[st.idx];
        let speaker_first = (line[0] || "").trim().split(" ")[0].toLowerCase();
        let my_first = curr_persona_name.split(" ")[0].toLowerCase();
        if (speaker_first === my_first) {
          // Active speaker: dialogue text on top of the bubble art, so the
          // text's own white box is made transparent.
          curr_pronunciatio.setText(line[1]);
          curr_pronunciatio.setFontSize(14);
          curr_pronunciatio.setWordWrapWidth(220, true);
          curr_pronunciatio.setBackgroundColor("rgba(0,0,0,0)");
          curr_bubble.setVisible(true);
        } else {
          curr_pronunciatio.setText("💬");
          curr_pronunciatio.setFontSize(28);
          curr_pronunciatio.setWordWrapWidth(null);
          curr_pronunciatio.setBackgroundColor("#ffffff");
          curr_bubble.setVisible(false);
        }
      } else {
        curr_pronunciatio.setFontSize(28);
        curr_pronunciatio.setWordWrapWidth(null);
        curr_pronunciatio.setBackgroundColor("#ffffff");
        curr_bubble.setVisible(false);
      }

      // *** SLEEPING "Zzz" PARTICLES ***
      // Float a slow stream of motes above any agent whose current action is
      // sleeping; tear the emitter down once they are no longer asleep.
      (function () {
        var pinfo = execute_movement["persona"][curr_persona_name] || {};
        var sleeping = ((pinfo["description"] || "").toLowerCase().indexOf("sleep") >= 0);
        if (sleeping) {
          try {
            var px = curr_persona.body.x + tile_width / 2;
            var py = curr_persona.body.y - sprite_disp_size / 2;
            var z = zzz_emitters[curr_persona_name];
            if (!z) {
              var zp = curr_scene.add.particles('zzz_particle');
              var zem = zp.createEmitter({
                x: px, y: py,
                speedY: { min: -55, max: -28 },
                speedX: { min: -8, max: 8 },
                alpha:  { start: 0.9, end: 0 },
                scale:  { start: 0.4, end: 1.1 },
                lifespan: 2200,
                frequency: 750,
                quantity: 1
              });
              zp.setDepth(BUBBLE_DEPTH + curr_persona.body.y + 1);
              zzz_emitters[curr_persona_name] = { mgr: zp, em: zem };
            } else {
              z.em.setPosition(px, py);
              z.mgr.setDepth(BUBBLE_DEPTH + curr_persona.body.y + 1);
            }
          } catch (e) { /* particle API mismatch -- skip zzz */ }
        } else if (zzz_emitters[curr_persona_name]) {
          try { zzz_emitters[curr_persona_name].mgr.destroy(); } catch (e) {}
          delete zzz_emitters[curr_persona_name];
        }
      })();

      // *** OBJECT-TILE GLOW ***
      // Softly pulse a colored rectangle on the tile of the game object the
      // agent is settled on (blue = bed, amber = seat, red = appliance).
      (function () {
        var gfx = window['obj_glow_' + curr_persona_name];
        if (!gfx) return;
        gfx.clear();
        var pinfo = execute_movement["persona"][curr_persona_name] || {};
        var pose = pinfo["object_pose"];
        var mt = movement_target[curr_persona_name];
        var settled = mt && curr_persona.body.x === mt[0] && curr_persona.body.y === mt[1];
        if (!pose || !pose["anchor_tile"] || !settled) return;
        var wx = pose["anchor_tile"][0] * tile_width;
        var wy = pose["anchor_tile"][1] * tile_width;
        var obj_name = (pose["object"] || "").toLowerCase();
        var color;
        if (obj_name.indexOf("bed") >= 0 || obj_name.indexOf("bunk") >= 0) color = 0x5b8fd4;
        else if (SEAT_OBJECTS.some(function (o) { return obj_name.indexOf(o) >= 0; })) color = 0xd4894a;
        else color = 0xd44a4a;
        var alpha = 0.22 + 0.16 * Math.sin(time / 600);
        gfx.fillStyle(color, alpha);
        gfx.fillRoundedRect(wx, wy, tile_width, tile_width, 4);
        gfx.setDepth(curr_persona.body.y - 1);
      })();

	      if (execute_count > 0) {
	        if (curr_persona.body.x < movement_target[curr_persona_name][0]) {
	          curr_persona.body.x += movement_speed; 
	          anims_direction = "r";
	          pre_anims_direction = "r"
	          pre_anims_direction_dict[curr_persona_name] = "r"
	        } else if (curr_persona.body.x > movement_target[curr_persona_name][0]) {
	          curr_persona.body.x -= movement_speed; 
	          anims_direction = "l";
	          pre_anims_direction = "l"
	          pre_anims_direction_dict[curr_persona_name] = "l"
	        } else if (curr_persona.body.y < movement_target[curr_persona_name][1]) {
	          curr_persona.body.y += movement_speed;
	          anims_direction = "d";
	          pre_anims_direction = "d"
	          pre_anims_direction_dict[curr_persona_name] = "d"
	        } else if (curr_persona.body.y > movement_target[curr_persona_name][1]) {
	          curr_persona.body.y -= movement_speed;
	          anims_direction = "u";
	          pre_anims_direction = "u"
	          pre_anims_direction_dict[curr_persona_name] = "u"
	        } else {
	        	anims_direction = "";
	        }

	        // *** FOOTSTEP DUST ***
	        // Emit a small dust burst at the agent's feet at the midpoint of
	        // each tile crossing, but only while they are actually moving.
	        if (anims_direction !== "" &&
	            execute_count === Math.floor(execute_count_max / 2)) {
	          try {
	            var de = dust_emitters[curr_persona_name];
	            if (!de) {
	              var dp = curr_scene.add.particles('dust_particle');
	              de = dp.createEmitter({
	                lifespan: 350,
	                speedX: { min: -18, max: 18 },
	                speedY: { min: -20, max: -8 },
	                alpha:  { start: 0.6, end: 0 },
	                scale:  { start: 0.6, end: 0.1 },
	                frequency: -1,
	                quantity: 3
	              });
	              dp.setDepth(curr_persona.body.y - 1);
	              dust_emitters[curr_persona_name] = de;
	            }
	            de.explode(3, curr_persona.body.x + tile_width / 2,
	                          curr_persona.body.y + tile_width - 4);
	          } catch (e) { /* particle API mismatch -- skip dust */ }
	        }

	        // Keep the pronunciatio/dialogue bottom-centered above the agent's
	        // head, and Y-sort everything: the agent at its feet (painter's
	        // algorithm, so lower agents draw in front of higher ones), the
	        // bubble and text far above the map layers so dialogue is never
	        // occluded by roofs or other agents.
	        curr_pronunciatio.x = curr_persona.body.x + tile_width / 2;
          // Bottom of the chip sits just above the tile-centered sprite's
          // top edge.
          curr_pronunciatio.y = curr_persona.body.y + tile_width / 2
                                - sprite_disp_size / 2 - 8;
          curr_persona.setDepth(curr_persona.body.y);
          curr_pronunciatio.setDepth(BUBBLE_DEPTH + curr_persona.body.y);
          if (curr_bubble.visible) {
            // Draw the bubble fresh each frame as a rounded rectangle with a
            // soft drop shadow and a downward tail, sized around the current
            // dialogue line. Geometry is drawn in local space centered on the
            // graphics origin, then the whole object is positioned (and later
            // de-overlapped by layoutBubbles) via its x/y -- mirroring how the
            // old PNG image was anchored.
            var pad_x = BUBBLE_PAD_X, pad_top = BUBBLE_PAD_TOP, tail = BUBBLE_TAIL;
            var tw = curr_pronunciatio.width + pad_x * 2;
            var total_h = curr_pronunciatio.height + pad_top + tail;
            var bodyH = total_h - tail;
            var left = -tw / 2, top = -total_h / 2;
            curr_bubble.clear();
            // Drop shadow.
            curr_bubble.fillStyle(0x000000, 0.12);
            curr_bubble.fillRoundedRect(left + 2, top + 2, tw, bodyH, 8);
            // Bubble body.
            curr_bubble.fillStyle(0xf5f0e8, 0.94);
            curr_bubble.fillRoundedRect(left, top, tw, bodyH, 8);
            // Tail pointing down toward the speaker.
            var ty = top + bodyH;
            curr_bubble.fillTriangle(-6, ty, 6, ty, 0, ty + tail);
            curr_bubble.x = curr_pronunciatio.x;
            curr_bubble.y = curr_pronunciatio.y
                            - curr_pronunciatio.height / 2
                            + (tail - pad_top) / 2;
            curr_bubble.setDepth(BUBBLE_DEPTH + curr_persona.body.y - 1);
          }

          if (anims_direction == "l") {
			      curr_persona.anims.play(curr_persona_name + "-left-walk", true);
			      curr_persona.setAngle(0);
			    } else if (anims_direction == "r") {
			      curr_persona.anims.play(curr_persona_name + "-right-walk", true);
			      curr_persona.setAngle(0);
			    } else if (anims_direction == "u") {
			      curr_persona.anims.play(curr_persona_name + "-up-walk", true);
			      curr_persona.setAngle(0);
			    } else if (anims_direction == "d") {
			      curr_persona.anims.play(curr_persona_name + "-down-walk", true);
			      curr_persona.setAngle(0);
			    } else {
			      curr_persona.anims.stop();

			      // If we were moving, pick an idle frame from this agent's own atlas
			      if (pre_anims_direction_dict[curr_persona_name] == "l") curr_persona.setTexture(curr_persona_name, "left");else
			      if (pre_anims_direction_dict[curr_persona_name] == "r") curr_persona.setTexture(curr_persona_name, "right");else
			      if (pre_anims_direction_dict[curr_persona_name] == "u") curr_persona.setTexture(curr_persona_name, "up");else
			      if (pre_anims_direction_dict[curr_persona_name] == "d") curr_persona.setTexture(curr_persona_name, "down");

			      // *** OBJECT-INTERACTION GROUNDING ***
			      // While idle on a game object, pose the agent so they read as
			      // using it instead of standing on it. Preference order: a real
			      // "lie"/"sit" frame if this character's sheet ships one (drop-in
			      // via atlas.json), else an approximation with the existing
			      // 20-frame art (rotate for sleep, face the camera for seats, face
			      // away for appliances). We deliberately do NOT move the sprite --
			      // it already sits on the object tile from pathfinding, and
			      // repositioning was shoving agents off their beds.
			      let curr_pinfo = execute_movement["persona"][curr_persona_name] || {};
			      let idle_desc = (curr_pinfo["description"] || "").toLowerCase();
			      let pose = curr_pinfo["object_pose"];
			      // The object being used: from the cluster geometry if the agent
			      // stands on one, else the last segment of the action address
			      // ("... @ world:sector:arena:game_object").
			      let idle_addr = (curr_pinfo["description"] || "").split("@")[1] || "";
			      let idle_obj = ((pose && pose["object"]) ||
			                      idle_addr.split(":").pop() || "").trim().toLowerCase();
			      let char_tex = this.textures.get(curr_persona_name);
			      curr_persona.setAngle(0);
			      if (GROUND_SLEEP && idle_desc.indexOf("sleep") >= 0) {
			        if (idle_obj.indexOf("bed") >= 0 && char_tex.has("lie")) {
			          // In-bed pose: head on the pillow with a blanket over the body.
			          // The sprite is drawn head-up, so rotate it to this bed's
			          // headboard direction -- the Ville has both vertical (head up)
			          // and horizontal (head left) beds, so a fixed orientation left
			          // sleepers lying sideways on the horizontal ones (BED_HEAD).
			          curr_persona.setTexture(curr_persona_name, "lie");
			          var bx = Math.round(curr_persona.body.x / tile_width);
			          var by = Math.round(curr_persona.body.y / tile_width);
			          var bhead = BED_HEAD[bx + "," + by] || "up";
			          curr_persona.setAngle(BED_HEAD_ANGLE[bhead] || 0);
			        } else if (idle_obj.indexOf("bed") >= 0) {
			          // No in-bed frame in this sheet: face the camera, upright, on
			          // the bed's pillow row.
			          curr_persona.setTexture(curr_persona_name, "down");
			        }
			        // Sleeping anywhere that isn't a bed (the sim sometimes parks
			        // a sleeper at a toilet or shower): stay upright -- the zzz
			        // chip carries the meaning; a blanket on a toilet does not.
			      } else if (idle_obj &&
			                 SEAT_OBJECTS.some(function (o) { return idle_obj.indexOf(o) >= 0; })) {
			        curr_persona.setTexture(curr_persona_name,
			                                char_tex.has("sit") ? "sit" : "down");
			      } else if (idle_obj &&
			                 APPLIANCE_OBJECTS.some(function (o) { return idle_obj.indexOf(o) >= 0; })) {
			        // Facing away from the camera reads as working at the
			        // appliance (counters/sinks/desks sit against upper walls).
			        // Prefer a dedicated "lean" frame if the sheet ships one.
			        curr_persona.setTexture(curr_persona_name,
			                                char_tex.has("lean") ? "lean" : "up");
			      }
			    };

	      } 
	      else {
	        // Once we are done moving the personas, we move on to the "process"
	        // stage where we will send the current locations of all personas at the
	        // end of the movemments to the frontend server, and then the backend.
	        for (let i=0; i<Object.keys(personas).length; i++) {
	          let curr_persona_name = Object.keys(personas)[i]
	          let curr_persona = personas[curr_persona_name];
	          curr_persona.body.x = movement_target[curr_persona_name][0];
	          curr_persona.body.y = movement_target[curr_persona_name][1];
	        }
	        phase = "process";
	        execute_count = execute_count_max + 1;
	        step = step + 1;
	      }
	    }

	    // De-overlap pass: runs on the same frames the natural positions were
	    // just recomputed, so the shifts never accumulate.
	    if (execute_count > 0) {
	      layoutBubbles();
	    }

	    // Filling in the action description.
	    if (execute_count == execute_count_max) {
	      for (let i=0; i<Object.keys(personas).length; i++) {
	      	let action_description = ""
	        let curr_persona_name = Object.keys(personas)[i];
	        let curr_persona_name_os = curr_persona_name.replace(/ /g,"_");
	        let description_content = execute_movement["persona"][curr_persona_name]["description"];
	        let chat_content = ""

	        if (execute_movement["persona"][curr_persona_name]["chat"] != null ){
		        for (let j=0; j<execute_movement["persona"][curr_persona_name]["chat"].length; j++) { 
		        	chat_content += execute_movement["persona"][curr_persona_name]["chat"][j][0] + ": " + execute_movement["persona"][curr_persona_name]["chat"][j][1] + "<br>"
		        }
		      } else {
		      	chat_content = "<em>None at the moment</em>"
		      }
	        // action_description += description_content + "<br>";

	        // Defensive lookups: the sidebar markup can differ between layouts
	        // (e.g. the chat line is hidden in the redesigned sidebar), so never
	        // assume an element exists -- a missing node must not break the loop.
	        let el_action = document.getElementById("current_action__"+curr_persona_name_os);
	        let el_addr   = document.getElementById("target_address__"+curr_persona_name_os);
	        let el_chat   = document.getElementById("chat__"+curr_persona_name_os);
	        if (el_action) el_action.innerHTML = description_content.split("@")[0];
	        if (el_addr)   el_addr.innerHTML   = description_content.split("@")[1];
	        if (el_chat)   el_chat.innerHTML   = chat_content;
	      }
	      
	    }

	    execute_count = execute_count - 1;
	  }
	}

	// Control button binders
	var play_button=document.getElementById("play_button");
	var pause_button=document.getElementById("pause_button");
</script>
