# LOCAL DEV ONLY -- Docker Compose automatically merges this file on top of
# docker-compose.yml when you run `docker compose` in this directory.
#
# It bind-mounts the backend source into the container so code changes (e.g.
# after `git pull`) take effect by just restarting reverie.py -- no image
# rebuild needed. This file is NOT used on the NAS (there you paste only
# docker-compose.yml into Portainer), so it never affects the deployment.
#
# PREREQUISITE: mounting ./reverie hides the utils.py that the Dockerfile
# generates at build time, so create it once in your clone (it is gitignored):
#
#   cp reverie/backend_server/utils.docker.py reverie/backend_server/utils.py

services:
  generative-agents:
    volumes:
      - ./reverie:/app/reverie
